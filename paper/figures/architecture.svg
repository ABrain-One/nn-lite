<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
  <title>NN-Lite architecture</title>
  <desc>Models flow from the LEMUR dataset through the NN-Lite host (load, convert, orchestrate, record), over adb to physical Android devices or emulators, and the measurements flow back into LEMUR.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/>
    </marker>
    <style>
      .ttl  { font-size: 19px; font-weight: 700; }
      .sub  { font-size: 14px; fill: #52606D; }
      .h    { font-size: 16px; font-weight: 700; fill: #1F2933; }
      .t    { font-size: 14px; fill: #323F4B; }
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 12.5px; fill: #5C3D0B; }
      .chip { font-size: 14px; font-weight: 700; fill: #1F2933; }
      .flow { stroke: #1F2933; stroke-width: 2; fill: none; }
      .meas { stroke: #B7791F; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="548" fill="#FFFFFF"/>

  <!-- ============ LEMUR (source and sink) ============ -->
  <rect x="12" y="20" width="200" height="468" rx="14" fill="#F4F0FB" stroke="#7C5CBF" stroke-width="1.5"/>
  <text x="112" y="47" text-anchor="middle" class="ttl" fill="#3F2A78">LEMUR dataset</text>
  <text x="112" y="67" text-anchor="middle" class="sub">model zoo + statistics</text>

  <rect x="26" y="92" width="172" height="62" rx="9" fill="#FFFFFF" stroke="#B9A5E0" stroke-width="1.5"/>
  <text x="112" y="118" text-anchor="middle" class="h">Architectures</text>
  <text x="112" y="139" text-anchor="middle" class="t">PyTorch source code</text>

  <rect x="26" y="166" width="172" height="62" rx="9" fill="#FFFFFF" stroke="#B9A5E0" stroke-width="1.5"/>
  <text x="112" y="192" text-anchor="middle" class="h">Hyperparameters</text>
  <text x="112" y="213" text-anchor="middle" class="t">and input transforms</text>

  <rect x="26" y="240" width="172" height="62" rx="9" fill="#FFFFFF" stroke="#B9A5E0" stroke-width="1.5"/>
  <text x="112" y="266" text-anchor="middle" class="h">Trained weights</text>
  <text x="112" y="287" text-anchor="middle" class="t">Hugging Face Hub</text>

  <line x1="30" y1="336" x2="194" y2="336" stroke="#B9A5E0" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="26" y="364" width="172" height="110" rx="9" fill="#FFF6E0" stroke="#D69E2E" stroke-width="1.5"/>
  <text x="112" y="392" text-anchor="middle" class="h">On-device stats</text>
  <text x="112" y="417" text-anchor="middle" class="mono">stat/run/tflite/</text>
  <text x="112" y="437" text-anchor="middle" class="mono">{fp32,int8}/&lt;model&gt;/</text>
  <text x="112" y="457" text-anchor="middle" class="mono">android_&lt;dev&gt;.json</text>

  <!-- ============ NN-Lite host ============ -->
  <rect x="248" y="20" width="270" height="468" rx="14" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="383" y="47" text-anchor="middle" class="ttl" fill="#1B4B82">NN-Lite host</text>
  <text x="383" y="67" text-anchor="middle" class="sub">Python CLI on a workstation</text>

  <!-- stage 1 -->
  <rect x="262" y="92" width="242" height="80" rx="9" fill="#FFFFFF" stroke="#9CBDE3" stroke-width="1.5"/>
  <circle cx="286" cy="118" r="13" fill="#2F6DB5"/>
  <text x="286" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="308" y="123" class="h">Load</text>
  <text x="276" y="146" class="t">rebuild the network from code</text>
  <text x="276" y="163" class="t">and restore its weights</text>

  <!-- stage 2 -->
  <rect x="262" y="186" width="242" height="80" rx="9" fill="#FFFFFF" stroke="#9CBDE3" stroke-width="1.5"/>
  <circle cx="286" cy="212" r="13" fill="#2F6DB5"/>
  <text x="286" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="308" y="217" class="h">Convert</text>
  <text x="276" y="240" class="t">litert-torch → .tflite</text>
  <text x="276" y="257" class="t">FP32 and INT8 (post-training)</text>

  <!-- stage 3 -->
  <rect x="262" y="280" width="242" height="80" rx="9" fill="#FFFFFF" stroke="#9CBDE3" stroke-width="1.5"/>
  <circle cx="286" cy="306" r="13" fill="#2F6DB5"/>
  <text x="286" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="308" y="311" class="h">Orchestrate</text>
  <text x="276" y="334" class="t">resumable queue, cool-downs,</text>
  <text x="276" y="351" class="t">restarts, USB re-connect</text>

  <!-- stage 4 -->
  <rect x="262" y="374" width="242" height="80" rx="9" fill="#FFFFFF" stroke="#9CBDE3" stroke-width="1.5"/>
  <circle cx="286" cy="400" r="13" fill="#2F6DB5"/>
  <text x="286" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="308" y="405" class="h">Record</text>
  <text x="276" y="428" class="t">one JSON schema, device</text>
  <text x="276" y="445" class="t">telemetry, per-backend errors</text>

  <line x1="383" y1="172" x2="383" y2="184" class="flow" marker-end="url(#ah)"/>
  <line x1="383" y1="266" x2="383" y2="278" class="flow" marker-end="url(#ah)"/>

  <!-- ============ adb bridge ============ -->
  <rect x="530" y="92" width="30" height="362" rx="8" fill="#37474F"/>
  <text transform="translate(550 273) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="1">adb  ·  USB or emulator</text>

  <!-- ============ Android targets ============ -->
  <rect x="572" y="20" width="316" height="468" rx="14" fill="#EAF6EF" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="730" y="47" text-anchor="middle" class="ttl" fill="#1D5E3A">Android targets</text>
  <text x="730" y="67" text-anchor="middle" class="sub">no root, no per-model app build</text>

  <!-- physical device -->
  <rect x="586" y="92" width="288" height="174" rx="10" fill="#FFFFFF" stroke="#8CC7A4" stroke-width="1.5"/>
  <text x="600" y="119" class="h">Physical device</text>
  <text x="600" y="141" class="t">native benchmark_model binary</text>
  <rect x="600" y="158" width="82" height="36" rx="7" fill="#DCE7F5" stroke="#8FA9CC"/>
  <text x="641" y="181" text-anchor="middle" class="chip">CPU</text>
  <rect x="689" y="158" width="82" height="36" rx="7" fill="#FBE4CF" stroke="#D9A36D"/>
  <text x="730" y="181" text-anchor="middle" class="chip">GPU</text>
  <rect x="778" y="158" width="82" height="36" rx="7" fill="#E9DFF8" stroke="#A58BD1"/>
  <text x="819" y="181" text-anchor="middle" class="chip">NNAPI</text>
  <text x="600" y="220" class="t">latency statistics per backend</text>
  <text x="600" y="238" class="t">plus SoC, CPU and memory probes</text>
  <text x="600" y="256" class="t">recorded with emulator = false</text>

  <!-- emulator -->
  <rect x="586" y="280" width="288" height="174" rx="10" fill="#FFFFFF" stroke="#8CC7A4" stroke-width="1.5"/>
  <text x="600" y="307" class="h">Emulator (AVD)</text>
  <text x="600" y="329" class="t">NN-Lite Android app (Kotlin,</text>
  <text x="600" y="346" class="t">TFLite Interpreter)</text>
  <rect x="600" y="360" width="82" height="36" rx="7" fill="#DCE7F5" stroke="#8FA9CC"/>
  <text x="641" y="383" text-anchor="middle" class="chip">CPU</text>
  <rect x="689" y="360" width="82" height="36" rx="7" fill="#FBE4CF" stroke="#D9A36D"/>
  <text x="730" y="383" text-anchor="middle" class="chip">GPU</text>
  <rect x="778" y="360" width="82" height="36" rx="7" fill="#E9DFF8" stroke="#A58BD1"/>
  <text x="819" y="383" text-anchor="middle" class="chip">NNAPI</text>
  <text x="600" y="422" class="t">automatic boot, install and</text>
  <text x="600" y="440" class="t">crash recovery of the AVD</text>

  <!-- ============ flows: models and commands (solid) ============ -->
  <!-- LEMUR sources into Load -->
  <line x1="198" y1="123" x2="260" y2="123" class="flow" marker-end="url(#ah)"/>
  <polyline points="198,197 226,197 226,123" class="flow"/>
  <polyline points="198,271 226,271 226,197" class="flow"/>
  <!-- orchestrate to bridge -->
  <line x1="504" y1="320" x2="528" y2="320" class="flow" marker-end="url(#ah)"/>
  <!-- bridge to targets -->
  <line x1="560" y1="150" x2="584" y2="150" class="flow" marker-end="url(#ah)"/>
  <line x1="560" y1="338" x2="584" y2="338" class="flow" marker-end="url(#ah)"/>

  <!-- ============ flows: measurements (dashed) ============ -->
  <line x1="586" y1="206" x2="562" y2="206" class="meas" marker-end="url(#ahm)"/>
  <line x1="586" y1="410" x2="562" y2="410" class="meas" marker-end="url(#ahm)"/>
  <line x1="530" y1="414" x2="506" y2="414" class="meas" marker-end="url(#ahm)"/>
  <line x1="262" y1="419" x2="200" y2="419" class="meas" marker-end="url(#ahm)"/>

  <!-- ============ legend ============ -->
  <line x1="236" y1="516" x2="276" y2="516" class="flow" marker-end="url(#ah)"/>
  <text x="284" y="521" class="t">models, weights and commands</text>
  <line x1="508" y1="516" x2="548" y2="516" class="meas" marker-end="url(#ahm)"/>
  <text x="556" y="521" class="t">measurements and errors</text>
</svg>
