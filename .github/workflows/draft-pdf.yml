name: Draft PDF
on:
  push:
    paths:
      - doc/joss-paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        # Pinned to a reviewed commit of the Open Journals action (master as of 2026-09-27);
        # update deliberately when the action changes.
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: doc/joss-paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: doc/joss-paper/paper.pdf
